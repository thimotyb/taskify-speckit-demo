# Taskify local stack. Secrets come from .env (copy .env.example); never commit .env.
services:
  project-service:
    build:
      context: .
      dockerfile: services/project-service/Dockerfile
    environment:
      TASKIFY_SERVICE_TOKEN: ${TASKIFY_SERVICE_TOKEN:?set in .env}
      TASKIFY_DB_USER: ${TASKIFY_DB_USER:?set in .env}
      TASKIFY_DB_PASSWORD: ${TASKIFY_DB_PASSWORD:?set in .env}
      TASKIFY_DB_FILE_KEY: ${TASKIFY_DB_FILE_KEY:?set in .env}
    volumes:
      - project-data:/data/project-service
    expose:
      - "8081"

  task-service:
    build:
      context: .
      dockerfile: services/task-service/Dockerfile
    environment:
      TASKIFY_SERVICE_TOKEN: ${TASKIFY_SERVICE_TOKEN:?set in .env}
      TASKIFY_DB_USER: ${TASKIFY_DB_USER:?set in .env}
      TASKIFY_DB_PASSWORD: ${TASKIFY_DB_PASSWORD:?set in .env}
      TASKIFY_DB_FILE_KEY: ${TASKIFY_DB_FILE_KEY:?set in .env}
      TASKIFY_PROJECT_SERVICE_URL: http://project-service:8081
    volumes:
      - task-data:/data/task-service
    depends_on:
      - project-service
    expose:
      - "8082"

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      TASKIFY_PROJECT_SERVICE_URL: http://project-service:8081
      TASKIFY_TASK_SERVICE_URL: http://task-service:8082
      TASKIFY_ALLOWED_ORIGIN: http://localhost:3000
    depends_on:
      - project-service
      - task-service
    ports:
      - "8080:8080"

  frontend:
    build:
      context: frontend
    depends_on:
      - gateway
    ports:
      - "3000:8080"

volumes:
  project-data:
  task-data:
